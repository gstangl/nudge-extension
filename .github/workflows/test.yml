name: Test

on:
  push:
  pull_request:

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bridge/package-lock.json
            test/package-lock.json
      - run: npm ci
        working-directory: bridge
      - run: npm ci
        working-directory: test
      - run: npm run test:ci
        working-directory: test
