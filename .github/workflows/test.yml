name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bridge/package-lock.json
            test/package-lock.json
      - run: npm ci
        working-directory: bridge
      - run: npm ci
        working-directory: test
      - run: npx playwright install --with-deps chromium
        working-directory: test
      - run: node test/run-portable-regression.mjs
      - run: node test/run-browser-regression.mjs --headless
      - run: node test/browser-parity.mjs --chromium --headless
      - run: node test/browser-coexistence.mjs --chromium-only --headless
      - name: Retain implementation evidence (not Safari acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-preview-verification
          path: artifacts/safari/
          if-no-files-found: error
